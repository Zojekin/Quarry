name: Release Please & Windows Packaging

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-windows:
    name: Build & Upload Windows Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows packages
        run: pnpm run package

      - name: Upload Windows assets & normalize release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = "apps/desktop/release"
          $expected = @(
            "Quarry-Setup-$env:RELEASE_VERSION-x64.exe",
            "Quarry-$env:RELEASE_VERSION-win-x64.zip",
            "latest.yml"
          )
          $assets = @()
          foreach ($name in $expected) {
            $filePath = Join-Path $releaseDir $name
            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
              throw "Expected release artifact not found: $filePath"
            }
            $assets += $filePath
          }
          $metadata = Get-Content -LiteralPath (Join-Path $releaseDir 'latest.yml') -Raw
          $installer = [regex]::Escape($expected[0])
          $version = [regex]::Escape($env:RELEASE_VERSION)
          $hash = (Get-FileHash -LiteralPath $assets[0] -Algorithm SHA512).Hash
          $sha512 = [regex]::Escape([Convert]::ToBase64String([Convert]::FromHexString($hash)))
          if ($metadata -cnotmatch "(?m)^version: $version\r?$" -or
              $metadata -cnotmatch "(?m)^files:\r?\n  - url: $installer\r?\n    sha512: $sha512\r?$") {
            throw 'latest.yml does not match the release version and installer SHA-512'
          }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "gh release upload failed with exit code $LASTEXITCODE"
          }

          $meta = gh release view $env:RELEASE_TAG --json body | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "gh release view failed with exit code $LASTEXITCODE"
          }
          $escapedVersion = [regex]::Escape($env:RELEASE_VERSION)
          $cleanedBody = ([string]$meta.body) -replace "(?s)^\s*#{1,3}\s+\[?v?$escapedVersion\]?(?:\([^\)]*\))?(?:\s*\([^)]*\))?\s*(?:\r?\n)+", ""
          $cleanedBody = $cleanedBody.Trim()
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesFile, $cleanedBody, (New-Object System.Text.UTF8Encoding($false)))
          gh release edit $env:RELEASE_TAG --title $env:RELEASE_VERSION --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) {
            throw "gh release edit failed with exit code $LASTEXITCODE"
          }
